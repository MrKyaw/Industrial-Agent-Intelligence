[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-agent-intelligence"
version = "1.0.0"
description = "Behavioral assurance, tool-use policy, and evaluation harness for industrial AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyaw Kyaw" }]
keywords = [
  "ai-agents",
  "evaluation",
  "guardrails",
  "industrial-automation",
  "hvac",
  "reinforcement-learning",
  "llm",
  "ai-safety",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
iai = "iai.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/Industrial-Agent-Intelligence"
Documentation = "https://github.com/MrKyaw/Industrial-Agent-Intelligence/tree/main/docs"
Issues = "https://github.com/MrKyaw/Industrial-Agent-Intelligence/issues"
Changelog = "https://github.com/MrKyaw/Industrial-Agent-Intelligence/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: exercises multi-second end-to-end paths",
  "property: randomized invariants with fixed seeds",
]

[tool.coverage.run]
branch = true
source = ["src/iai"]
omit = ["src/iai/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
